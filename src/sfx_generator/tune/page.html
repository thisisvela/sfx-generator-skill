<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>sfx tune</title>
<script>try{var t=localStorage.getItem("sfx-theme");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
:root{--ink:#0a0a0a;--mute:#6b6b6b;--line:#0000000f;--line2:#0000001a;--bg:#fff;--surface:#fff;--head:#fffc;--red:#b3261e;--card:0 0 0 1px #0000000f,0 1px 2px -1px #0000000f,0 2px 4px 0 #0000000a;--ease:cubic-bezier(.23,1,.32,1)}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--ink:#f2f2f2;--mute:#9a9a9a;--line:#ffffff14;--line2:#ffffff24;--bg:#0c0c0c;--surface:#161616;--head:#0c0c0ccc;--red:#ff7b72;--card:0 0 0 1px #ffffff14,0 1px 2px -1px #00000066,0 2px 4px 0 #00000055}:root:not([data-theme=light]) .pic img{filter:invert(1)}:root:not([data-theme=light]) .theme .sun{display:block}:root:not([data-theme=light]) .theme .moon{display:none}}
:root[data-theme=dark]{--ink:#f2f2f2;--mute:#9a9a9a;--line:#ffffff14;--line2:#ffffff24;--bg:#0c0c0c;--surface:#161616;--head:#0c0c0ccc;--red:#ff7b72;--card:0 0 0 1px #ffffff14,0 1px 2px -1px #00000066,0 2px 4px 0 #00000055}:root[data-theme=dark] .pic img{filter:invert(1)}:root[data-theme=dark] .theme .sun{display:block}:root[data-theme=dark] .theme .moon{display:none}
:root[data-theme=light] .pic img{filter:none}
.theme{width:34px;height:34px;padding:0;border:0;background:none;display:grid;place-items:center;color:var(--mute)}.theme:hover{color:var(--ink);box-shadow:none}.theme svg{width:18px;height:18px;display:block}.theme .sun{display:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
header{height:54px;display:flex;align-items:center;gap:14px;padding:0 clamp(18px,5vw,28px);border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--head);backdrop-filter:blur(8px);z-index:2}
header b{font-weight:600;letter-spacing:-.2px}header .v{color:var(--mute);font-size:12px}
header .sp{flex:1}
main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:0;min-height:calc(100vh - 54px)}
.panel{border-right:1px solid var(--line);padding:18px clamp(18px,3vw,24px);overflow:auto;max-height:calc(100vh - 54px)}
.stage{padding:22px clamp(18px,4vw,36px)}
h1{font-size:22px;font-weight:500;letter-spacing:-.4px;margin:0 0 2px}h1 em{font-family:Georgia,serif;font-style:italic;font-weight:400}
.doc{color:var(--mute);margin:0 0 14px}
.tips{font-size:12.5px;color:var(--mute);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:0 0 16px;box-shadow:var(--card)}
.param{display:grid;grid-template-columns:1fr 86px;gap:6px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--line)}
.param label{font-size:13px}.param label small{color:var(--mute);display:block;font-size:11.5px;line-height:1.3}
.param input[type=range]{grid-column:1/2;width:100%;accent-color:var(--ink)}
.param input[type=number],.param input[type=text]{font:inherit;font-size:12.5px;padding:4px 6px;border:1px solid var(--line2);border-radius:6px;width:86px;font-family:ui-monospace,Menlo,Consolas,monospace}
.param .u{font-size:11px;color:var(--mute);text-align:right}
.group{margin-top:18px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
button{font:inherit;font-size:13px;padding:7px 12px;border-radius:8px;border:1px solid var(--line2);background:var(--surface);color:var(--ink);cursor:pointer;transition:transform .2s var(--ease),box-shadow .2s var(--ease)}
button:hover{box-shadow:var(--card)}button:active{transform:scale(.98)}
button.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.bar{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 16px}
label.sw{display:inline-flex;gap:6px;align-items:center;font-size:13px;color:var(--mute)}
.pic{border:1px solid var(--line);border-radius:12px;box-shadow:var(--card);overflow:hidden;background:var(--surface);margin:0 0 14px}
.pic svg{display:block;width:100%;height:72px;color:var(--ink)}
.pic img{display:block;width:100%;height:180px;object-fit:fill;image-rendering:auto}
.cap{font-size:11.5px;color:var(--mute);padding:6px 12px;border-top:1px solid var(--line);display:flex;justify-content:space-between}
.nums{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px;margin:0 0 16px}
.num{border:1px solid var(--line);border-radius:10px;padding:8px 10px;box-shadow:var(--card)}
.num b{display:block;font-weight:500;font-size:15px;font-family:ui-monospace,Menlo,Consolas,monospace;letter-spacing:-.2px}
.num span{font-size:11px;color:var(--mute)}
.num.bad b{color:var(--red)}
.warn{color:var(--red);font-size:12.5px;margin:0 0 12px}
.status{font-size:12px;color:var(--mute);min-height:18px}
.post{margin-top:18px}
@media(max-width:820px){main{grid-template-columns:1fr}.panel{max-height:none;border-right:0;border-bottom:1px solid var(--line)}}
</style>
</head>
<body>
<header><b>sfx tune</b><span class="v" id="which"></span><span class="sp"></span>
  <button class="theme" id="theme" type="button" aria-label="switch between light and dark" title="Light or dark"><svg class="sun" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true"><circle cx="8" cy="8" r="3"/><path d="M8 1.5v1.6M8 12.9v1.6M1.5 8h1.6M12.9 8h1.6M3.4 3.4l1.1 1.1M11.5 11.5l1.1 1.1M3.4 12.6l1.1-1.1M11.5 4.5l1.1-1.1"/></svg><svg class="moon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linejoin="round" aria-hidden="true"><path d="M13.2 10.1A5.6 5.6 0 0 1 5.9 2.8a5.6 5.6 0 1 0 7.3 7.3z"/></svg></button>
  <button id="save">Save preset</button><button class="primary" id="export">Export WAV · OGG · MP3</button></header>
<main>
  <section class="panel">
    <h1 id="title"></h1>
    <p class="doc" id="doc"></p>
    <div class="tips" id="tips"></div>
    <div id="params"></div>
    <div class="group">Stereo and level</div>
    <div class="post" id="post"></div>
    <div class="group">Preset</div>
    <div class="param"><label>id<small>file name and catalog key</small></label><input type="text" id="pid"></div>
    <div class="param"><label>category<small>level in a video mix</small></label><select id="pcat"></select></div>
    <div class="param"><label>lead<small>s before the cue</small></label><input type="number" id="plead" step="0.005"></div>
    <div class="param"><label>use<small>one line: when to use it</small></label><input type="text" id="puse"></div>
  </section>
  <section class="stage">
    <div class="bar">
      <button class="primary" id="play">&#9654; Play</button>
      <button id="playorig">Play original</button>
      <button id="ab">A then B</button>
      <label class="sw"><input type="checkbox" id="loop"> loop</label>
      <label class="sw"><input type="checkbox" id="invideo" checked> at in-video level</label>
      <label class="sw"><input type="checkbox" id="overvoice"> over narration</label>
      <button id="reset">Reset to preset</button>
      <span class="status" id="status"></span>
    </div>
    <div class="pic"><div id="wave"></div><div class="cap"><span>waveform</span><span id="len"></span></div></div>
    <div class="pic"><img id="spec" alt="spectrogram"><div class="cap"><span>spectrogram, 0-12 kHz, ink = loud</span><span>look for vertical lines (clicks), a smear at 0 Hz (DC), tails that run on</span></div></div>
    <div class="nums" id="nums"></div>
    <div class="warn" id="warns"></div>
  </section>
</main>
<script>
const $=s=>document.querySelector(s);
const ctx=new (window.AudioContext||window.webkitAudioContext)();
const limiter=ctx.createDynamicsCompressor();limiter.threshold.value=-3;limiter.knee.value=0;limiter.ratio.value=20;limiter.attack.value=0.002;limiter.release.value=0.08;limiter.connect(ctx.destination);
let S=null, params={}, post={width:1,lr_offset_ms:0,gain_db:0,presence:0}, cur=null, orig=null, voiceBuf=null, playing=null, timer=null, seq=0;
const dB=g=>Math.pow(10,g/20);
async function decode(b64){const bin=atob(b64);const u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return await ctx.decodeAudioData(u.buffer);}
function fmt(v,step){const d=step&&step<1?Math.max(0,Math.ceil(-Math.log10(step))):0;return Number(v).toFixed(Math.min(d,4));}
function paramRow(p){
  const row=document.createElement('div');row.className='param';
  const lab=document.createElement('label');lab.innerHTML=`${p.name}<small>${p.doc}</small>`;row.appendChild(lab);
  if(p.kind==='float'||p.kind==='int'||p.kind==='seed'){
    const num=document.createElement('input');num.type='number';num.step=p.step||1;num.value=params[p.name];
    if(p.min!=null)num.min=p.min;if(p.max!=null)num.max=p.max;
    const rng=document.createElement('input');rng.type='range';rng.min=p.min??0;rng.max=p.max??(p.kind==='seed'?9999:1);rng.step=p.step||1;rng.value=params[p.name];
    if(p.kind==='seed'){rng.max=Math.max(2000,Number(params.seed)+500);}
    rng.oninput=()=>{num.value=rng.value;set(p.name,Number(rng.value));};
    num.onchange=()=>{rng.value=num.value;set(p.name,Number(num.value));};
    row.appendChild(num);row.appendChild(rng);
    const u=document.createElement('div');u.className='u';u.textContent=p.unit||'';row.appendChild(u);
  } else if(p.kind==='bool'){const c=document.createElement('input');c.type='checkbox';c.checked=!!params[p.name];c.onchange=()=>set(p.name,c.checked);row.appendChild(c);}
  else if(p.kind==='choice'){const s=document.createElement('select');for(const c of p.choices){const o=document.createElement('option');o.value=c;o.textContent=c;s.appendChild(o);}s.value=params[p.name];s.onchange=()=>set(p.name,s.value);row.appendChild(s);}
  return row;
}
function postRow(name,doc,min,max,step,unit){
  const row=document.createElement('div');row.className='param';
  row.innerHTML=`<label>${name}<small>${doc}</small></label>`;
  const num=document.createElement('input');num.type='number';num.step=step;num.value=post[name];num.min=min;num.max=max;
  const rng=document.createElement('input');rng.type='range';rng.min=min;rng.max=max;rng.step=step;rng.value=post[name];
  rng.oninput=()=>{num.value=rng.value;post[name]=Number(rng.value);schedule();};num.onchange=()=>{rng.value=num.value;post[name]=Number(num.value);schedule();};
  row.appendChild(num);row.appendChild(rng);const u=document.createElement('div');u.className='u';u.textContent=unit;row.appendChild(u);return row;
}
function set(k,v){params[k]=v;schedule();}
function schedule(){clearTimeout(timer);timer=setTimeout(rerender,120);}
async function rerender(){
  const my=++seq;$('#status').textContent='rendering…';const t0=performance.now();
  const r=await fetch('/render',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({params,post})}).then(r=>r.json());
  if(my!==seq)return; if(r.error){$('#status').textContent='error: '+r.error;return;}
  cur=r;cur.buf=await decode(r.wav_b64);show(r);$('#status').textContent=`rendered in ${Math.round(performance.now()-t0)} ms`;
  if(playing&&$('#loop').checked){stop();play(cur);}
}
function show(r){
  $('#wave').innerHTML=r.waveform_svg;$('#spec').src='data:image/png;base64,'+r.spec_png_b64;$('#len').textContent=r.seconds.toFixed(3)+' s';
  const rep=r.report;const cat=$('#pcat').value;const pl=placement(rep,cat);
  const items=[['loudest 100 ms',rep.loudness_max_lufs+' LUFS'],['peak',rep.peak_dbfs+' dBFS',Math.abs(rep.peak_dbfs+1.5)>0.1],['in video mix',pl.in_mix+' LU'+(pl.capped?' (capped)':''),pl.capped],['gain in mix',pl.gain+' dB'],['decay to -20 dB',rep['decay_to_-20dB_s']+' s'],['centroid',rep.centroid_hz+' Hz'],['pitch track',rep.pitch_track_hz.join(' → ')+' Hz'],['end level',rep.end_level_db+' dB',rep.end_level_db>-40],['DC',rep.dc_offset,Math.abs(rep.dc_offset)>0.002&&rep.seconds>0.15],['mono sum drop',rep.mono_sum_drop_db+' dB',rep.mono_sum_drop_db>3]];
  $('#nums').innerHTML=items.map(([k,v,bad])=>`<div class="num${bad?' bad':''}"><b>${v}</b><span>${k}</span></div>`).join('');
  $('#warns').innerHTML=(rep.warnings||[]).map(w=>'⚠ '+w).join('<br>');
}
function placement(rep,cat){const level=S.category_lu[cat]??-4;const asked=-14+level-rep.loudness_max_lufs;const cap=-6-rep.peak_dbfs;const g=Math.min(asked,cap);return {gain:g.toFixed(2),capped:g<asked-1e-9,in_mix:(rep.loudness_max_lufs+g+14).toFixed(2)};}
function gainFor(r){if(!($('#invideo').checked||$('#overvoice').checked))return 1;return dB(Number(placement(r.report,$('#pcat').value).gain));}
function stop(){if(playing){try{playing.forEach(s=>s.stop())}catch(e){}playing=null;}}
async function play(r,when){
  await ctx.resume();stop();if(!r||!r.buf)return;const t0=when??ctx.currentTime+0.02;
  const src=ctx.createBufferSource();src.buffer=r.buf;src.loop=$('#loop').checked;const g=ctx.createGain();g.gain.value=gainFor(r);src.connect(g);g.connect(limiter);
  const srcs=[src];
  if($('#overvoice').checked&&S.voice){if(!voiceBuf)voiceBuf=await decode(S.voice.b64);const vs=ctx.createBufferSource();vs.buffer=voiceBuf;vs.connect(limiter);vs.start(t0);src.start(t0+Math.max(0,S.voice.cue-Number($('#plead').value||0)));srcs.push(vs);}
  else src.start(t0);
  playing=srcs;src.onended=()=>{if(playing===srcs)playing=null;};return t0+r.buf.duration;
}
$('#play').onclick=()=>play(cur);$('#playorig').onclick=()=>play(orig);
$('#ab').onclick=async()=>{const t=await play(orig);setTimeout(()=>play(cur),Math.max(0,(t-ctx.currentTime+0.4)*1000));};
$('#loop').onchange=()=>{if(!$('#loop').checked)stop();};
$('#reset').onclick=()=>{params={...S.preset.params};post={width:1,lr_offset_ms:0,gain_db:0,presence:S.preset.presence||0};build();rerender();};
$('#pcat').onchange=()=>{if(cur)show(cur);};
$('#save').onclick=async()=>{const r=await fetch('/save',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('#pid').value,params,category:$('#pcat').value,lead:Number($('#plead').value),use:$('#puse').value,presence:post.presence})}).then(r=>r.json());$('#status').textContent=r.error?('error: '+r.error):('saved '+r.saved);};
$('#theme').onclick=()=>{const r=document.documentElement;const dark=r.dataset.theme?r.dataset.theme==='dark':matchMedia('(prefers-color-scheme: dark)').matches;r.dataset.theme=dark?'light':'dark';try{localStorage.setItem('sfx-theme',r.dataset.theme)}catch(e){}};
$('#export').onclick=async()=>{const r=await fetch('/export',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({id:$('#pid').value,params,post})}).then(r=>r.json());$('#status').textContent=r.error?('error: '+r.error):('exported '+Object.values(r.exported).join(', '));};
function build(){
  const box=$('#params');box.innerHTML='';for(const p of S.schema.params)box.appendChild(paramRow(p));
  const pb=$('#post');pb.innerHTML='';pb.appendChild(postRow('width','stereo width (mid/side); 1 = as rendered, 0 = mono',0,2,0.05,''));pb.appendChild(postRow('lr_offset_ms','left/right offset: widens, but check the mono sum',-10,10,0.1,'ms'));pb.appendChild(postRow('gain_db','extra gain before the in-mix placement',-24,12,0.5,'dB'));pb.appendChild(postRow('presence','small-speaker presence: harmonics of the low band so a laptop hears the weight (saved with the preset)',0,1,0.05,''));
}
(async()=>{
  S=await fetch('/state').then(r=>r.json());params={...S.preset.params};post.presence=S.preset.presence||0;
  $('#which').textContent=S.preset.id+' · '+S.schema.id;$('#title').innerHTML=`<em>${S.preset.id}</em>`;$('#doc').textContent=S.schema.doc;$('#tips').textContent=S.schema.tips||'';
  const cat=$('#pcat');for(const k of Object.keys(S.category_lu)){const o=document.createElement('option');o.value=k;o.textContent=`${k} (${S.category_lu[k]} LU)`;cat.appendChild(o);}cat.value=S.preset.category;
  $('#pid').value=S.preset.id;$('#plead').value=S.preset.lead;$('#puse').value=S.preset.use||'';
  if(!S.voice)$('#overvoice').disabled=true;
  build();orig=S.original;orig.buf=await decode(orig.wav_b64);cur=orig;show(orig);$('#status').textContent='ready';
})();
</script>
</body>
</html>
