name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e .
      - name: build the site deterministically
        run: sfx site -o site
        env:
          SFX_SITE_VERIFICATION: ${{ vars.SFX_SITE_VERIFICATION }}
          SFX_GA_ID: ${{ vars.SFX_GA_ID }}
      - name: link check
        run: |
          python - <<'EOF'
          from pathlib import Path
          from sfx_generator.site.build import check_links
          missing = check_links(Path("site"))
          if missing:
              raise SystemExit("missing links:\n" + "\n".join(missing))
          print("links ok")
          EOF
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b  # v5
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa  # v3
        with:
          path: site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e  # v4
