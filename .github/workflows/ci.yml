name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: ${{ matrix.python }}
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: the skill's acceptance runs
        run: |
          sfx make "make a quick whoosh for a slide" -o out/whoosh -n 3
          sfx make "a soft error sound" -o out/error -n 3
          test -f out/whoosh/audition.html && test -f out/error/audition.html
          ls out/whoosh/*.json out/error/*.ogg
